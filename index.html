<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>パルカカウンター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 2人=4列×2行(1行が1人: ライフ/食材/資材/ログ)。1人=2×2。各マスは数字の下に+1と−1を縦に並べる。 */
:root {
  --bg: #0e1621; --panel: #16212f; --panel-2: #1e2d40; --fg: #e6edf5; --muted: #8b9fb5;
  --line: #2a3b50; --life: #ff7168; --food: #4ade80; --mat: #ffa033; --accent: #4da3ff; --on-accent: #07121f; --night: #7c4dff; --night-ink: #9a74ff;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef3f1; --panel: #ffffff; --panel-2: #e4ece8; --fg: #16302b; --muted: #5d7770;
  --line: #cddbd5; --life: #d6453d; --food: #22b14c; --mat: #f27d0c; --accent: #1f8a70; --on-accent: #ffffff; --night-ink: #5b2fc9;
  color-scheme: light;
}
/* 夜: 背景(--bg)だけを紫系にする。マスの色(--panel など)は変えない */
:root.night { --bg: #1d1236; --panel: #2b1c52; --line: #54399a; --muted: #b9a6e8; }
:root[data-theme="light"].night { --bg: #d8c9f0; --panel: #eee6fb; --line: #bca6e6; --muted: #6b5499; }
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

/* 全体を包む枠。縦固定の端末で横画面にするときはここを 90度回転する */
#app { position: fixed; inset: 0; }
html.rot1 #app, html.rot2 #app { inset: auto; top: 0; left: 0; width: 100dvh; height: 100dvw; transform-origin: 0 0; }
html.rot1 #app { transform: translateX(100dvw) rotate(90deg); }
html.rot2 #app { transform: translateY(100dvh) rotate(-90deg); }
/* メニュー層: メニューを開いている間は向きを固定し、開き直したときにいまの回転に合わせる */
#menuLayer { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
#menuLayer .scrim, #menuLayer .sheet, #menuLayer .toast { pointer-events: auto; }
#menuLayer.ml1, #menuLayer.ml2 { inset: auto; top: 0; left: 0; width: 100dvh; height: 100dvw; transform-origin: 0 0; }
#menuLayer.ml1 { transform: translateX(100dvw) rotate(90deg); }
#menuLayer.ml2 { transform: translateY(100dvh) rotate(-90deg); }
html.rot1 .stage, html.rot2 .stage { padding: 6px; }

/* ステージ: 1人=1行 */
.stage {
  position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 6px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) calc(6px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(6px + env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.player { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; min-height: 0; min-width: 0; }

.player.flip { transform: rotate(180deg); }

/* マス */
.counter {
  --c: var(--life);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 3fr 2fr; gap: 6px;
  min-height: 0; min-width: 0; background: var(--panel); border-radius: 14px; padding: 6px;
}
.counter.food { --c: var(--food); }
.counter.mat { --c: var(--mat); }
.mid { grid-row: 1; grid-column: 1 / -1; position: relative; pointer-events: none; /* 数値の行はタップを受けない(両隣のボタンに重なるため) */ display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
.label {
  position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 5px;
  font-weight: 800; font-size: clamp(11px, 2svh, 15px); color: var(--muted); white-space: nowrap;
}
.dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
.ico { display: inline-flex; color: var(--c); flex: none; }
.ico svg { width: 1.5em; height: 1.5em; display: block; }
.value {
  font-variant-numeric: tabular-nums; font-weight: 800; color: var(--c); line-height: 1; letter-spacing: -.02em;
  font-size: min(7svh, 14vw); padding-top: 12px;
}
.step {
  background: var(--panel-2); border: 2px solid var(--c); border-radius: 12px; min-height: 0; min-width: 0;
  font-weight: 800; font-variant-numeric: tabular-nums; font-size: min(3.4svh, 4.6vw);
}
/* 既定は左−・右+。相手側は180度回転するだけで、相手から見ても左−・右+になる。「カウンター位置切り替え」で+左・−右。 */
/* ボタン群: 位置と段数は、マスの形から JS(layoutSteps)が決めて、各ボタンに直接指定する */
.steps { grid-row: 2; grid-column: 1 / -1; position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-height: 0; min-width: 0; }
.step:active { background: var(--c); color: var(--panel); }

/* ログのマス */
.logpanel { order: -1; background: var(--panel); border-radius: 14px; padding: 6px 8px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.logpanel h2 { font-size: 12px; font-weight: 800; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; flex: none; color: var(--muted); min-height: 30px; }
.menu-btn {
  width: 34px; height: 30px; border-radius: 8px; flex: none;
  background: transparent; border: 1.5px solid var(--line); font-size: 18px; line-height: 1; font-weight: 800; color: var(--muted);
}
.logpanel ol.log { flex: 1; max-height: none; min-height: 0; font-size: 13px; }
.logpanel ol.log li { flex-wrap: wrap; gap: 0 6px; padding: 4px 0; }
.logpanel .t { display: inline; }

/* 一人モード: 2×2 */
.stage.solo { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
.stage.solo .player { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-row: 1; }
.stage.solo .value { font-size: min(11svh, 22vw); }
.stage.solo .step { font-size: min(5.5svh, 11vw); }
.stage.solo .label { font-size: clamp(12px, 2.4svh, 16px); }
.stage.solo .logpanel { order: -1; }
.stage.solo .logpanel ol.log { font-size: 15px; }
.stage.solo .logpanel .t { display: inline; }

/* 一人モード: ログのマスに「戻す」と「リセット」(縦=下側、横=右側) */
.logtools { display: flex; gap: 6px; flex: none; margin-top: 6px; }
.lt {
  flex: 1; min-height: 46px; padding: 0 8px; border-radius: 10px; background: var(--panel-2);
  border: 1.5px solid var(--line); font-weight: 800; font-size: 14px;
}
.lt.warn { border-color: var(--life); color: var(--life); }
.lt:disabled { opacity: .4; cursor: default; }
.lt:active:not(:disabled) { background: var(--accent); color: var(--on-accent); }

/* 横画面: 右端にサイド列(上から メニュー・元に戻す・リセット)。一人・二人共通 */
.side { display: none; grid-row: 1 / -1; grid-template-rows: minmax(0, 64px) minmax(0, 104px) minmax(0, 64px) minmax(0, 64px); align-content: start; gap: 6px; min-height: 0; }
.sbtn {
  min-height: 0; padding: 0 4px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line);
  font-weight: 800; font-size: 13px; line-height: 1.2; color: var(--fg);
}
.sbtn.sm { font-size: 22px; color: var(--muted); }
.sbtn.warn { border-color: var(--life); color: var(--life); }
.sbtn:disabled { opacity: .4; cursor: default; }
.sbtn.night { font-size: 22px; color: var(--night-ink); }
.sbtn.night[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
.sbtn:active:not(:disabled) { background: var(--accent); color: var(--on-accent); }
/* 横レイアウトは html.land (実際に横向き、またはメニューで横画面にしたとき) */
html.land .stage:not(.solo) { grid-template-columns: 1fr 1fr 72px; }
html.land .stage.solo { grid-template-columns: 1fr 72px; }
html.land .side { display: grid; grid-column: -2 / -1; }
html.land .stage.center:not(.solo) { grid-template-columns: 1fr 72px 1fr; }
html.land .stage.center:not(.solo) .side { grid-column: 2; }
/* 縦レイアウトの二人: 上のプレイヤーと下のプレイヤーの間に置く */
html:not(.land) .stage.center:not(.solo) { grid-template-rows: 1fr auto 1fr; }
html:not(.land) .stage.center:not(.solo) .side { grid-row: 2; }
html.land .player.lswap .logpanel { grid-row: 1; grid-column: 2; }
html.land .player.lswap .counter.life { grid-row: 1; grid-column: 1; }
html.land .logtools, html.land .logpanel .menu-btn { display: none; }

/* 縦向きの二人モード: スマホを対面で囲む想定で、上下に並べる(上=相手・180度回転、下=自分) */
html:not(.land) .stage:not(.solo) { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr auto; }
html:not(.land) .side { display: grid; grid-column: 1 / -1; grid-row: auto; grid-template-columns: 56px 1.5fr 1fr 1fr; grid-template-rows: 52px; align-content: stretch; }
html:not(.land) .logtools, html:not(.land) .logpanel .menu-btn { display: none; }
html:not(.land) .stage:not(.solo) .logpanel .t { display: inline; }

/* メニューシート */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 30; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 88%; overflow-y: auto;
  background: var(--bg); border-top: 2px solid var(--line); border-radius: 20px 20px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet > * { flex: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h1 { font-size: 18px; font-weight: 800; margin: 0; }
.sheet h2 { font-size: 14px; font-weight: 800; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.sheet h2 span { color: var(--muted); font-weight: 500; font-size: 13px; }
.close { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 16px; font-weight: 800; min-height: 44px; }
.mode { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.mode button { border: 0; background: none; padding: 12px 8px; font-weight: 800; min-height: 48px; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.mode button:disabled { opacity: .4; cursor: default; background: none; color: var(--fg); }
.card .mode + .mode, .card .tools + .mode { margin-top: 8px; }
.exrow { display: grid; grid-template-columns: 4.6em repeat(4, minmax(0, 1fr)); gap: 6px; align-items: center; margin-top: 8px; }
.exrow.life { --c: var(--life); } .exrow.food { --c: var(--food); } .exrow.mat { --c: var(--mat); }
.exnm { font-weight: 800; font-size: 13px; color: var(--c); }
.chip { background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; min-height: 44px; font-weight: 800; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--c); color: var(--panel); border-color: var(--c); }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tools.two { grid-template-columns: repeat(2, 1fr); }
.tool small { display: block; font-size: 11px; font-weight: 700; opacity: .8; }
.tool {
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 6px 4px; font-weight: 800; min-height: 52px; font-size: 13px; line-height: 1.25;
}
.tool[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tool:disabled { opacity: .4; cursor: default; background: var(--panel); border-color: var(--line); color: var(--fg); }
.tool.warn { border-color: var(--life); color: var(--life); }
.tool.warn.armed { background: var(--life); color: var(--panel); }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; }
.setting { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.setting input[type=number], .setting input[type=text] {
  font: inherit; font-size: 16px; width: 5.5em; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums;
}
:root { --sync: #56B4E9; } /* 同期の枠: 色の見分けがつきにくくても見えやすい青(Okabe-Ito) */
:root[data-theme="light"] { --sync: #0072B2; }
:root { --p1c: #56B4E9; --p2c: #E58FC2; } /* ログの「1P」「2P」の文字色(色の見分けがつきにくくても、青とピンクで区別しやすい) */
:root[data-theme="light"] { --p1c: #0072B2; --p2c: #B0357F; }
.who { font-weight: 800; }
.who.p0 { color: var(--p1c); }
.who.p1 { color: var(--p2c); }
.stage.guest .step, .stage.guest [data-act] { opacity: .45; pointer-events: none; } /* ゲストは観戦のみ */
.tools.one { grid-template-columns: 1fr; }
#sync-card { border: 2px solid var(--sync); }
#sync-card .syf { flex-wrap: nowrap; }
#sync-card .syf label { flex: none; min-width: 5.4em; }
#sync-card .syhint { color: var(--muted); font-size: 12px; margin: 4px 0 0 calc(5.4em + 10px); }
#sync-card input::placeholder { color: var(--muted); opacity: .6; }
#sy-room { text-transform: uppercase; }
#sync-card .tools.one { grid-template-columns: 1fr; }
#sy-qrbox { background: #fff; padding: 8px; border-radius: 12px; width: 220px; max-width: 100%; margin: 10px auto 0; }
#sy-qrbox svg { display: block; width: 100%; height: auto; }
#sync-card .tools { margin-top: 8px; }
#sync-card .setting { margin-top: 8px; }
ol.log {
  list-style: none; margin: 0; padding: 0 6px 0 0; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column;
  scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
}
ol.log::-webkit-scrollbar { width: 6px; }
ol.log::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
ol.log::-webkit-scrollbar-track { background: transparent; }
ol.log li { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; align-items: baseline; }
ol.log li:last-child { border-bottom: 0; }
.t { color: var(--muted); font-size: 12px; flex: none; }
.t .s { display: none; }
ol.log.sec .t .s, ol.log li.cmp .t .s { display: inline; }
ol.log li.cmp .ft { display: none; }
ol.log li.cmp .t { flex-basis: 100%; } /* 1段目は時刻だけ。2段目に、名前と増減を同じ段で並べる */
.chg { margin-left: auto; font-weight: 800; flex: none; }
.empty { color: var(--muted); padding: 6px 2px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: 90%;
}
/* 極端に小さい画面: 文字をマスの大きさ(コンテナ単位)に合わせて枠からはみ出さない */
.counter, .logpanel { container-type: size; overflow: hidden; }
.stage .counter .value { font-size: var(--vf, min(32cqh, 38cqw)); padding-top: 0; }
.stage .counter .step { font-size: var(--sf, min(14cqh, 17cqw)); padding: 0; overflow: hidden; }
.stage .counter .label { font-size: clamp(9px, 7cqh, 15px); }
.stage .logpanel ol.log { font-size: clamp(9px, 8cqh, 14px) !important; }
.stage .logpanel ol.log li { padding: 2px 0; }
@container (max-height: 120px) {
  .logpanel h2, .nm { display: none; }
  /* 名前が省略されたときは、アイコンを数字の左に置く */
  .label { position: static; margin-right: 4px; }
  .ico svg { width: clamp(12px, 26cqh, 26px); height: clamp(12px, 26cqh, 26px); }
}
ol.log::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
/* 縦から横へ切り替えたときの「傾けてください」表示(少しだけ出て消える) */
.tilt { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 36; pointer-events: none !important; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; }
.tilt.show { opacity: 1; visibility: visible; transition: opacity .2s ease; }
.tilt-card { background: rgba(14, 26, 23, .86); color: #fff; border-radius: 20px; padding: 20px 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
.tilt-phone { height: 160px; display: flex; align-items: center; justify-content: center; }
.tilt-phone svg { display: block; }
.tilt-text { font-weight: 800; font-size: 17px; }
.tilt-sub { font-weight: 700; font-size: 15px; opacity: .85; min-height: 1.2em; }
.tilt-phone { --from: 0deg; --to: 0deg; transform: rotate(var(--to)); }
.tilt.show .tilt-phone { animation: tiltTo 1.3s ease-in-out .2s both; }
@keyframes tiltTo { from { transform: rotate(var(--from)); } to { transform: rotate(var(--to)); } }
@media (prefers-reduced-motion: reduce) {
  .tilt.show .tilt-phone { animation: none; transform: rotate(var(--to)); }
}

/* メニュー内ボタン: 押している間は少し縮んで暗くなり、離すと元に戻る */
.tool.pressed, .close.pressed, .mode button.pressed { filter: brightness(.9); }
@media (prefers-reduced-motion: no-preference) {
  .step { transition: background .1s; }
  .tool, .close, .mode button { transition: transform .14s ease, filter .14s ease, background-color .14s ease; }
  .tool.pressed, .close.pressed, .mode button.pressed { transform: scale(.94); transition-duration: .06s; }
}
</style>

<div id="app">
<div class="stage" id="stage" aria-label="カウンター"></div>

</div>
<div id="menuLayer">
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="メニュー" hidden>
  <div class="sheet-head">
    <h1>メニュー</h1>
    <button class="close" id="close" type="button">閉じる</button>
  </div>
  <div class="tools one">
    <button class="tool" id="role" type="button" aria-pressed="false">自分は1Pです</button>
  </div>
  <div class="mode" role="group" aria-label="人数">
    <button id="mode-solo" type="button">1P</button>
    <button id="mode-two" type="button">1P+2P</button>
  </div>
  <div class="tools two">
    <button class="tool" id="orient" type="button" aria-pressed="false">対面・縦置き<small>対面</small></button>
    <button class="tool" id="center" type="button" aria-pressed="false">サブメニュー中央置き</button>
  </div>
  <div class="tools">
    <button class="tool" id="swap" type="button" aria-pressed="false">カウンター位置切り替え<small>− / +</small></button>
    <button class="tool" id="wake" type="button" aria-pressed="false">画面を消さない</button>
    <button class="tool" id="rot" type="button" aria-pressed="false">横画面・縦画面</button>
  </div>
  <div class="mode" role="group" aria-label="画面の色">
    <button id="theme-dark" type="button">ダーク</button>
    <button id="theme-light" type="button">ホワイト</button>
  </div>
  <div class="card" id="steps-card">
    <h2>±2〜±5ボタン</h2>
    <div class="tools two">
      <button class="tool" id="sg" type="button" aria-pressed="true">±同時<small>オン</small></button>
      <button class="tool" id="ex" type="button" aria-pressed="true">1P/2P共通<small>オン</small></button>
    </div>
    <div class="mode" role="group" aria-label="個別設定の対象">
      <button id="ex-me" type="button">1P</button>

    if (!/^[0-9]{4}$/.test(pw)) { toast("パスワードは、数字4桁です"); return; }
    netJoin(room, pw);
  }
  function rnd(n, base) { var s = ""; for (var i = 0; i < n; i++) s += Math.floor(Math.random() * base).toString(base); return s; }
  // 部屋コードの入力欄: 数字と A〜Z だけ、6桁まで。小文字は大文字に替わる(全角も半角にする)
  function cleanRoom(v) { return normIn(v).toUpperCase().replace(/[^0-9A-Z]/g, "").slice(0, 6); }
  function fixRoom() {
    var el = $("sy-room"), pos = el.selectionStart, v = cleanRoom(el.value);
    if (v !== el.value) {
      var at = cleanRoom(el.value.slice(0, pos)).length;
      el.value = v; try { el.setSelectionRange(at, at); } catch (e) {}
    }
  }
  $("sy-room").addEventListener("input", function (e) { if (!e.isComposing) fixRoom(); });
  $("sy-room").addEventListener("compositionend", fixRoom);
  $("sy-join").addEventListener("click", function () { tryJoin($("sy-room").value, $("sy-pw").value); });
  // 新しく作る: 部屋コードは、毎回ランダム(すでに使われていたら作り直す)。パスワードは、入力があればそれを使い、空欄ならランダム
  $("sy-new").addEventListener("click", function () {
    var typed = normIn($("sy-pw").value), pw;
    if (typed === "") pw = rnd(4, 10);
    else if (/^[0-9]{4}$/.test(typed)) pw = typed;
    else { toast("パスワードは、数字4桁です(空欄ならランダムで作ります)"); return; }
    net.kept = false;
    createRoom(pw, 1);
  });
  // 切断: 部屋コードとパスワードは、入力欄に残す(そのまま「つなぐ」で使える)。入力欄を触ろうとしたら、リセットする
  $("sy-leave").addEventListener("click", function () {
    var room = S.sync ? S.sync.room.toUpperCase() : "", pw = S.sync ? S.sync.pw : "";
    netStop(); net.suspended = false; S.sync = null; S.role = 0; S.roleRoom = ""; save(); render();
    $("sy-room").value = room; $("sy-pw").value = pw; net.kept = !!room;
    syncUi();
  });
  ["sy-room", "sy-pw"].forEach(function (id) {
    $(id).addEventListener("focus", function () {
      if (net.kept) { net.kept = false; $("sy-room").value = ""; $("sy-pw").value = ""; }
    });
  });
  $("sy-qr").addEventListener("click", function () {
    var url = joinedUrl(), box = $("sy-qrbox");
    if (!url || !window.PalcaSync) return;
    var show = box.hidden;
    if (show) box.innerHTML = window.PalcaSync.qrSvg(url);
    box.hidden = !show;
    this.setAttribute("aria-pressed", show);
  });
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function (res, rej) {
      var ta = document.createElement("textarea"), done = false;
      ta.value = t; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { done = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      if (done) res(); else rej(new Error("copy"));
    });
  }
  // 自分の役割の切り替え(制限なし。自己判断): 1P → 2P → ゲスト → 1P
  $("role").addEventListener("click", function () { S.role = (S.role + 1) % 3; save(); render(); });
  $("sy-copy").addEventListener("click", function () {
    var url = joinedUrl();
    if (!url) return;
    copyText(url).then(function () { toast("URLをコピーしました"); }, function () { toast("コピーできませんでした"); });
  });
  var hideTimer = null, hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      hiddenAt = Date.now();
      clearTimeout(hideTimer);
      hideTimer = setTimeout(netSuspend, HIDE_MS);
    } else {
      clearTimeout(hideTimer);
      // 長く隠れていたら(タイマーが止められていた場合も含む)、つなぎ直す。短ければ、足りない分を確認するだけ
      if (S.sync && (net.suspended || (hiddenAt && Date.now() - hiddenAt >= HIDE_MS))) netResume();
      else bc(hello());
      hiddenAt = 0;
    }
  });
  // タブを閉じるとき(や、ページを離れるとき)は、先に退出して、相手に切れたことを早く知らせる
  window.addEventListener("pagehide", function () { netLeave(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted && S.sync) netResume(); });
  applyTheme();
  applyLayout();
  render();
  syncUi();
  // QR(または共有のアドレス)から開いたときは、そのまま部屋につなぐ。前回の部屋があれば、つなぎ直す
  (function () {
    var m = /^#r=([0-9a-zA-Z]{6})&p=([0-9]{4})$/.exec(location.hash);
    if (m) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} netJoin(m[1].toLowerCase(), m[2]); }
    else if (S.sync) netJoin(S.sync.room, S.sync.pw);
  })();
})();
</script>
